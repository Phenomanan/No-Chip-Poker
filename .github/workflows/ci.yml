name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  pot-regression:
    name: Pot Regression Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run pot regression
        run: npm run test:pot-regression
