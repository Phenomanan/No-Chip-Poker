name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run rules-engine unit tests
        run: npm run test:rules-engine

      - name: Run pot regression
        run: npm run test:pot-regression

      - name: Run admin controls integration tests
        run: npm run test:admin-controls

      - name: Run session handling regression tests
        run: npm run test:session-handling

      - name: Run four-player soak test
        run: npm run test:soak

      - name: Run kick and reorder rules tests
        run: npm run test:kick-reorder

      - name: Run rules property tests
        run: npm run test:properties

      - name: Run deal gate tests
        run: npm run test:deal-gate

      - name: Run randomized play (fuzz) test
        run: FUZZ_TABLES=3 FUZZ_HANDS=8 npm run test:fuzz
